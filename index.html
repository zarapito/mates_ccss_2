<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuntes de Matemáticas CCSS II</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231c64c8'/><text x='50' y='72' font-size='64' font-family='Georgia,serif' font-style='italic' fill='white' text-anchor='middle'>f</text></svg>">
<style>
  :root {
    --bg: #ffffff; --bg-side: #f6f7f9; --text: #1f2328; --muted: #59636e; --border: #d8dee4;
    --accent: #1c64c8; --code-bg: #f2f4f7; --table-head: #eef1f5;
    --info: #1c7ed6; --tip: #2b8a3e; --note: #6741d9; --warning: #e8590c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d; --bg-side: #1d2027; --text: #e6e8eb; --muted: #9aa4b1; --border: #343a46;
      --accent: #6ea8fe; --code-bg: #252a33; --table-head: #232833;
      --info: #4dabf7; --tip: #51cf66; --note: #9775fa; --warning: #ff922b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d; --bg-side: #1d2027; --text: #e6e8eb; --muted: #9aa4b1; --border: #343a46;
    --accent: #6ea8fe; --code-bg: #252a33; --table-head: #232833;
    --info: #4dabf7; --tip: #51cf66; --note: #9775fa; --warning: #ff922b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  #layout { display: flex; min-height: 100vh; }
  #side { width: 280px; flex-shrink: 0; background: var(--bg-side); border-right: 1px solid var(--border);
          position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 20px 16px; }
  #side h1 { font-size: 1.05rem; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
  #pinSide { display: none; margin-left: auto; border: 1px solid var(--border); background: var(--bg); color: var(--text);
             border-radius: 8px; padding: 0 8px; cursor: pointer; font-size: 1.1rem; line-height: 1.5; }
  #side .sub { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  #side .group { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  #side a { display: block; text-decoration: none; color: var(--text); padding: 4px 8px; border-radius: 6px; font-size: .93rem; }
  #side a:hover { background: var(--border); }
  #side a.active { background: var(--accent); color: #fff; }
  #side #toc a { font-size: .85rem; color: var(--muted); padding: 2px 8px 2px 16px; }
  #side #toc a:hover { color: var(--text); }
  #side #toc a.part { color: var(--text); font-weight: 600; padding-left: 8px; margin-top: 8px; }
  .doc h1 ~ h1 { font-size: 1.6rem; margin-top: 2.4em; padding: .4em .6em; border-radius: 8px; background: var(--bg-side); border-left: 5px solid var(--accent); }
  #main { flex: 1; min-width: 0; padding: 32px 48px 80px; }
  #content { max-width: 860px; margin: 0 auto; }
  #topbar { display: none; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 4; background: var(--bg);
            border-bottom: 1px solid var(--border); padding: 10px 16px; font-weight: 600; }
  #topbar button { border: 1px solid var(--border); background: var(--bg-side); color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 1.1rem; cursor: pointer; }
  /* Medium screens with the panel open: the menu folds behind ☰ so the theory keeps a readable width */
  @media (min-width: 861px) and (max-width: 1400px) {
    /* ☰ shows it again *beside* the theory (the theory narrows, nothing is covered); « hides it */
    body.has-panel:not(.pin-side) #side { display: none; }
    body.has-panel:not(.pin-side) #topbar { display: flex; margin: -32px -48px 24px; }
    body.has-panel:not(.pin-side) #content :is(h1, h2, h3) { scroll-margin-top: 70px; }
    body.has-panel.pin-side #main { padding: 32px 24px 80px; }
    body.has-panel.pin-side #pinSide { display: inline-block; }
  }
  #tools { position: fixed; top: 12px; right: 14px; display: flex; gap: 6px; z-index: 6; }
  #tools button, #panelHead button, #panelHead select { border: 1px solid var(--border); background: var(--bg-side); color: var(--text);
           border-radius: 8px; padding: 4px 9px; cursor: pointer; font: inherit; font-size: .92rem; }
  #panelBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* Side panel: a second document that stays open while the main view changes */
  :root { --pw: clamp(340px, 40vw, 560px); }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--pw); z-index: 7; display: flex; flex-direction: column;
           background: var(--bg); border-left: 1px solid var(--border); box-shadow: -6px 0 24px rgba(0,0,0,.08); }
  #panel[hidden] { display: none; }
  #panelHead { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg-side); }
  #panelHead select { flex: 1; min-width: 0; }
  #panelContent { flex: 1; overflow-y: auto; padding: 16px 22px 60px; font-size: .95rem; }
  #panelContent h1 { font-size: 1.4rem; }
  #panelContent h1 ~ h1 { font-size: 1.25rem; }
  #side .row { display: flex; align-items: center; gap: 2px; }
  #side .row a { flex: 1; }
  #side .row button { border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 6px; padding: 3px 7px; font-size: .9rem; }
  #side .row button:hover { background: var(--border); color: var(--text); }
  #side .row button.on { color: var(--accent); }
  #panelResize { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 1; }
  #panelResize:hover, body.resizing #panelResize { background: var(--accent); opacity: .5; }
  body.resizing { user-select: none; cursor: col-resize; }
  body.has-panel #main { margin-right: var(--pw); }
  body.has-panel #tools { right: calc(var(--pw) + 14px); }
  h1, h2, h3 { line-height: 1.25; scroll-margin-top: 16px; }
  h1 { font-size: 1.9rem; margin-top: 0; }
  h2 { font-size: 1.45rem; margin-top: 2.2em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.15rem; margin-top: 1.8em; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  em { color: var(--muted); }
  .table-wrap { overflow-x: auto; margin: 1em 0; }
  table { border-collapse: collapse; font-size: .95rem; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; vertical-align: middle; }
  th { background: var(--table-head); }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; display: block; margin: 1em auto; }
  mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  blockquote { margin: 1.2em 0; padding: .6em 1em; border-left: 4px solid var(--border); background: var(--bg-side); border-radius: 0 8px 8px 0; }
  blockquote > :first-child { margin-top: 0; } blockquote > :last-child { margin-bottom: 0; }
  .callout { --c: var(--info); border-left-color: var(--c); background: color-mix(in srgb, var(--c) 9%, var(--bg)); }
  .callout-title { font-weight: 700; color: var(--c); margin-bottom: .3em; }
  .callout-info { --c: var(--info); } .callout-tip { --c: var(--tip); } .callout-note { --c: var(--note); } .callout-warning { --c: var(--warning); }
  .callout-title::before { margin-right: .4em; }
  li.task { list-style: none; } li.task input { margin-right: .5em; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--border); }
  .pager a { text-decoration: none; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; }
  #error { color: var(--warning); }
  .theory-ref { font-size: .88rem; color: var(--muted); margin: -.4em 0 .8em; }
  a.to-panel::after { content: "⧉"; font-size: .8em; margin-left: .25em; opacity: .7; }
  .contact-form { display: grid; gap: 12px; max-width: 520px; margin: 1em 0; padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-side); }
  .contact-form label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
  .contact-form input, .contact-form textarea { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
  .contact-form textarea { resize: vertical; }
  .contact-form button { justify-self: start; font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  .contact-form small { color: var(--muted); }
  .contact-form .form-honey { display: none; }
  .form-ok { margin: 0; padding: 8px 12px; border-radius: 8px; background: color-mix(in srgb, var(--tip) 15%, var(--bg)); color: var(--text); }
  @media (max-width: 860px) {
    #layout { display: block; }
    #side { position: fixed; inset: 0 auto 0 0; width: 82%; max-width: 320px; transform: translateX(-100%); transition: transform .2s; z-index: 10; }
    #side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
    #topbar { display: flex; margin: -20px -16px 16px; }
    #content :is(h1, h2, h3) { scroll-margin-top: 70px; }
    #main { padding: 20px 16px 60px; }
    #tools { top: 9px; }
    body.has-panel #tools { right: 14px; }
    h1 { font-size: 1.55rem; }
    th, td { min-width: 120px; font-size: .9rem; }
    /* On phones the panel is a bottom sheet: theory on top, exercises below */
    #panel { top: auto; left: 0; width: 100%; height: 55vh; border-left: 0; border-top: 2px solid var(--accent); box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
    #panelResize { display: none; }
    #panelContent { padding: 12px 16px 40px; }
    body.has-panel #main { margin-right: 0; padding-bottom: 58vh; }
  }
  @media print {
    #side, #topbar, #tools, #panel, .pager { display: none !important; }
    body.has-panel #main { margin-right: 0; }
    #main { padding: 0; } h2 { break-after: avoid; } img, table, blockquote { break-inside: avoid; }
  }
</style>
<script>
  // Theme stored per viewer; optional.
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  window.MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']], processEscapes: true },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
    startup: { typeset: false }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
</head>
<body>
<div id="tools">
  <button id="panelBtn" title="Abrir/cerrar panel lateral (p. ej. ejercicios junto a la teoría)">⧉ Panel</button>
  <button id="theme" title="Cambiar tema claro/oscuro">◐</button>
</div>
<aside id="panel" hidden>
  <div id="panelResize" title="Arrastra para cambiar el ancho"></div>
  <div id="panelHead">
    <select id="panelSelect" aria-label="Documento del panel"></select>
    <button id="panelSwap" title="Intercambiar: llevar este documento a la vista principal">⇄</button>
    <button id="panelClose" title="Cerrar panel">✕</button>
  </div>
  <article id="panelContent" class="doc"></article>
</aside>
<div id="layout">
  <nav id="side">
    <h1>Matemáticas CCSS II <button id="pinSide" title="Ocultar el menú (vuelve con ☰)">«</button></h1>
    <div class="sub">2º Bachillerato · Comunidad de Madrid</div>
    <div id="docs"></div>
    <div class="group">En esta página</div>
    <div id="toc"></div>
  </nav>
  <div id="main">
    <div id="topbar"><button id="menu" aria-label="Menú">☰</button><span id="toptitle">Matemáticas CCSS II</span></div>
    <article id="content" class="doc">Cargando…</article>
  </div>
</div>
<script>
// ====== CONFIGURACIÓN: un bloque por carpeta dentro de /apuntes (sus imágenes, en <carpeta>/img) ======
const SECTIONS = [
  { group: 'Inicio', folder: '', docs: ['Inicio'] },
  { group: 'Funciones', folder: 'Funciones', docs: ['1 - Teoría Funciones', "Tabla f, f' y f''", '2 - Ejercicios Funciones', '3 - Soluciones Funciones'] },
];
const ROOT = 'apuntes/';
// =====================================================================================================

const ALL = SECTIONS.flatMap(s => s.docs);
const FOLDER_OF = Object.fromEntries(SECTIONS.flatMap(s => s.docs.map(d => [d, s.folder])));
const dirOf = doc => ROOT + (FOLDER_OF[doc] ? encodeURIComponent(FOLDER_OF[doc]) + '/' : '');
const $ = s => document.querySelector(s);
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const href = (doc, h) => '#doc=' + encodeURIComponent(doc) + (h ? '&h=' + slug(h) : '');
const label = d => d.replace(/^\d+\s*-\s*/, '');

// URL state: #doc=<main doc>&h=<heading>&panel=<side panel doc>
const state = () => {
  const p = new URLSearchParams(location.hash.slice(1));
  const panel = ALL.includes(p.get('panel')) ? p.get('panel') : null;
  return { doc: ALL.includes(p.get('doc')) ? p.get('doc') : ALL[0], h: p.get('h'), panel, ph: panel && p.get('ph') };
};
// Scroll the side panel (not the page) to one of its headings.
function scrollPanelTo(h) {
  const pc = $('#panelContent'), el = h && document.getElementById('p-' + h);
  if (el) pc.scrollTop += el.getBoundingClientRect().top - pc.getBoundingClientRect().top - 8; else pc.scrollTop = 0;
}
function go({ doc, h, panel, ph }) {
  const p = new URLSearchParams();
  p.set('doc', doc); if (h) p.set('h', h); if (panel) p.set('panel', panel); if (panel && ph) p.set('ph', ph);
  const hash = '#' + p.toString().replace(/\+/g, '%20');
  if (hash === location.hash) show(); else location.hash = hash;
}

function renderNav(current, panel) {
  $('#docs').innerHTML = SECTIONS.map(s =>
    `<div class="group">${esc(s.group)}</div>` +
    s.docs.map(d => `<div class="row"><a href="${href(d)}" class="${d === current ? 'active' : ''}">${esc(label(d))}</a>` +
      `<button data-panel="${esc(d)}" class="${d === panel ? 'on' : ''}" title="Abrir en el panel lateral">⧉</button></div>`).join('')
  ).join('');
}

// Convert Obsidian-flavoured markdown (math, wikilinks, callouts) into something marked can render.
function preprocess(md, doc) {
  const math = [];
  const keep = m => { math.push(m); return `MATHPH${math.length - 1}X`; };
  md = md.replace(/\$\$[\s\S]+?\$\$/g, keep).replace(/\$[^$\n]+?\$/g, keep);
  // embeds ![[file.svg|width]]
  md = md.replace(/!\[\[([^\]|]+?)(?:\|(\d+))?\]\]/g, (_, f, w) =>
    `<img src="${dirOf(doc)}img/${encodeURIComponent(f.trim())}" alt="${esc(f)}"${w ? ` style="width:${w}px"` : ''}>`);
  // links [[Doc#Heading|alias]]
  md = md.replace(/\[\[([^\]|#]*)(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g, (_, d, h, a) => {
    const target = d.trim() || doc;
    const text = a || (h ? (d.trim() ? `${label(target)} › ${h.trim()}` : h.trim()) : label(target));
    return `[${text}](${href(target, h && h.trim())})`;
  });
  // callouts: "> [!type] Title"
  md = md.replace(/^>\s*\[!(\w+)\][ \t]*(.*)$/gm, (_, t, title) =>
    `> <div class="callout-title" data-type="${t.toLowerCase()}">${title || t}</div>\n>`);
  return { md, math };
}

function postprocess(el, math, prefix) {
  const restore = s => s.replace(/MATHPH(\d+)X/g, (_, i) => esc(math[+i]));
  el.innerHTML = restore(el.innerHTML);
  el.querySelectorAll('.callout-title').forEach(t => t.closest('blockquote')?.classList.add('callout', 'callout-' + t.dataset.type));
  el.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.replaceWith(w); w.appendChild(t); });
  el.querySelectorAll('li input[type=checkbox]').forEach(i => i.closest('li').classList.add('task'));
  el.querySelectorAll('h1,h2,h3').forEach(h => { h.id = prefix + slug(h.textContent); });
  el.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

async function renderDoc(doc, el, prefix) {
  try {
    // no-cache: revalidate so edits uploaded to GitHub show up without a hard refresh.
    const res = await fetch(dirOf(doc) + encodeURIComponent(doc) + '.md', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const { md, math } = preprocess(await res.text(), doc);
    el.innerHTML = marked.parse(md, { gfm: true, breaks: true, headerIds: false, mangle: false });
    postprocess(el, math, prefix);
    // Links to a section of another document open in the side panel (from the main view or from the panel).
    el.querySelectorAll('a[href^="#doc="]').forEach(a => {
      const t = new URLSearchParams(a.getAttribute('href').slice(1));
      if (t.get('h') && t.get('doc') !== doc) { a.classList.add('to-panel'); a.title = 'Se abre en el panel lateral'; }
    });
    el.querySelectorAll('p').forEach(p => { if (/^Teoría:/.test(p.textContent)) p.classList.add('theory-ref'); });
    return true;
  } catch (e) {
    el.innerHTML = `<p id="error">No se pudo cargar «${esc(doc)}» (${esc(String(e.message || e))}).</p>`;
    return false;
  }
}
const typeset = el => window.MathJax && MathJax.typesetPromise
  ? MathJax.typesetPromise([el]) : new Promise(r => setTimeout(r, 100)).then(() => typeset(el));

let shownDoc = null, shownPanel;
async function show() {
  const { doc, h, panel, ph } = state();
  renderNav(doc, panel);
  $('#side').classList.remove('open');
  const mainChanged = doc !== shownDoc, panelChanged = panel !== shownPanel;
  shownDoc = doc; shownPanel = panel;
  await Promise.all([mainChanged && renderMain(doc), panelChanged && renderPanel(panel)]);
  const target = h && document.getElementById(h);
  if (target) target.scrollIntoView(); else if (mainChanged) window.scrollTo(0, 0);
  if (panel && (ph || panelChanged)) scrollPanelTo(ph);
  // Back from the contact form service (?_next=…&enviado=1): show the confirmation.
  const ok = document.getElementById('form-ok');
  if (ok) ok.hidden = !new URLSearchParams(location.hash.slice(1)).get('enviado');
}

async function renderPanel(panel) {
  document.body.classList.toggle('has-panel', !!panel);
  $('#panel').hidden = !panel;
  $('#panelBtn').classList.toggle('on', !!panel);
  if (!panel) return;
  try { localStorage.setItem('lastPanel', panel); } catch (e) {}
  $('#panelSelect').innerHTML = SECTIONS.map(s => `<optgroup label="${esc(s.group)}">` +
    s.docs.map(d => `<option value="${esc(d)}"${d === panel ? ' selected' : ''}>${esc(label(d))}</option>`).join('') + '</optgroup>').join('');
  const el = $('#panelContent');
  el.scrollTop = 0;
  if (await renderDoc(panel, el, 'p-')) await typeset(el);
}

async function renderMain(doc) {
  const el = $('#content');
  if (!await renderDoc(doc, el, '')) return;
  const i = ALL.indexOf(doc);
  const prev = ALL[i - 1], next = ALL[i + 1];
  el.insertAdjacentHTML('beforeend', `<nav class="pager">${prev ? `<a href="${href(prev)}">← ${esc(label(prev))}</a>` : '<span></span>'}${next ? `<a href="${href(next)}">${esc(label(next))} →</a>` : ''}</nav>`);
  // Secondary h1s are "parts" of a document: shown as group labels in the TOC.
  $('#toc').innerHTML = [...el.querySelectorAll('h1, h2')].slice(1).map(h =>
    `<a href="${href(doc, h.textContent)}" class="${h.tagName === 'H1' ? 'part' : ''}">${esc(h.textContent)}</a>`).join('');
  document.title = label(doc) + ' · Matemáticas CCSS II';
  $('#toptitle').textContent = label(doc);
  await typeset(el);
}

// Internal links keep the side panel open. A link inside the panel to its own document scrolls the panel.
// A link in the main text to a section of *another* document opens that section in the panel.
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-panel]');
  if (btn) { const s = state(); go({ ...s, h: null, panel: s.panel === btn.dataset.panel ? null : btn.dataset.panel }); return; }
  const a = e.target.closest('a[href^="#doc="]');
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  e.preventDefault();
  const t = new URLSearchParams(a.getAttribute('href').slice(1));
  const s = state();
  const inPanel = !!a.closest('#panel');
  if (inPanel && t.get('doc') === s.panel) return scrollPanelTo(t.get('h'));
  if (a.classList.contains('to-panel')) return go({ doc: s.doc, h: null, panel: t.get('doc'), ph: t.get('h') });
  go({ doc: t.get('doc'), h: t.get('h'), panel: s.panel });
});

$('#panelBtn').onclick = () => {
  const s = state();
  if (s.panel) return go({ ...s, h: null, panel: null });
  let last = null;
  try { last = localStorage.getItem('lastPanel'); } catch (e) {}
  const fallback = ALL.find(d => /ejercicios/i.test(d) && d !== s.doc) || ALL.find(d => d !== s.doc);
  go({ ...s, h: null, panel: ALL.includes(last) && last !== s.doc ? last : fallback });
};
$('#panelSelect').onchange = e => go({ ...state(), h: null, panel: e.target.value });
$('#panelSwap').onclick = () => { const s = state(); go({ doc: s.panel, h: null, panel: s.doc }); };
$('#panelClose').onclick = () => go({ ...state(), h: null, panel: null });

// Drag the panel's left edge to resize it (width remembered per viewer).
try { const w = localStorage.getItem('panelWidth'); if (w) document.documentElement.style.setProperty('--pw', w); } catch (e) {}
$('#panelResize').addEventListener('pointerdown', e => {
  e.preventDefault();
  document.body.classList.add('resizing');
  const move = ev => {
    const w = Math.round(Math.min(Math.max(window.innerWidth - ev.clientX, 300), window.innerWidth * 0.7));
    document.documentElement.style.setProperty('--pw', w + 'px');
  };
  const up = () => {
    document.body.classList.remove('resizing');
    window.removeEventListener('pointermove', move);
    try { localStorage.setItem('panelWidth', getComputedStyle(document.documentElement).getPropertyValue('--pw').trim()); } catch (e) {}
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up, { once: true });
});

// Medium screens with the panel open: ☰ shows the menu beside the theory, « hides it (remembered per viewer).
const setPin = on => {
  document.body.classList.toggle('pin-side', on);
  try { localStorage.setItem('pinSide', on ? '1' : '0'); } catch (e) {}
};
try { setPin(localStorage.getItem('pinSide') === '1'); } catch (e) {}
$('#pinSide').onclick = () => setPin(false);

// On phones ☰ slides the menu over the page; on larger screens it makes room for it.
$('#menu').onclick = () => matchMedia('(max-width: 860px)').matches ? $('#side').classList.toggle('open') : setPin(true);
$('#theme').onclick = () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#16181d';
  const t = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
};
window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
